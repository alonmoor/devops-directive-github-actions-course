name: demo-app CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: demo-app-ci
  cancel-in-progress: false

env:
  IMAGE: docker.io/alonmor2/demo-app
  GITOPS_REPO: alon-gitops-lab/gitops
  KUSTOMIZATION_FILE: apps/demo-app/overlays/onprem/kustomization.yaml

jobs:
  build-and-push:
    runs-on: [self-hosted, onprem]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout app-source
        uses: actions/checkout@v5

      - name: Isolate Docker config (bash)
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Compute image tag (bash)
        id: meta
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag will be: ${TAG}"

      - name: Log in to Docker Hub (action)
        uses: docker/login-action@v3
        with:
          username: alonmor2
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (bash)
        run: docker build -t "$IMAGE:${{ steps.meta.outputs.tag }}" .

      - name: Push image to Docker Hub (bash)
        run: docker push "$IMAGE:${{ steps.meta.outputs.tag }}"

      - name: Verify tag exists in registry (python)
        shell: python3 {0}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          import os, subprocess
          ref = f"{os.environ['IMAGE']}:{os.environ['TAG']}"
          r = subprocess.run(["docker", "manifest", "inspect", ref], capture_output=True, text=True)
          if r.returncode != 0:
              raise SystemExit(f"{ref} not found in registry: {r.stderr.strip()}")
          print(f"OK: {ref} is in the registry")

  bump-gitops:
    needs: build-and-push
    runs-on: [self-hosted, onprem]
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Bump newTag in kustomization (python)
        shell: python3 {0}
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          import os, re, pathlib
          path = pathlib.Path("gitops") / os.environ["KUSTOMIZATION_FILE"]
          text = path.read_text()
          new_text, count = re.subn(
              r'(?m)^([\t]*newTag:\s*")[^"]*(")',
              r'\g<1>' + os.environ["TAG"] + r'\2',
              text, count=1
          )
          if count != 1:
              raise SystemExit(f"No 'newTag:' line found in {path}")
          path.write_text(new_text)
          print(f"Set newTag to {os.environ['TAG']} in {path}")

      - name: Commit and push to gitops (bash)
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KUSTOMIZATION_FILE"
          git diff-cached --quiet && { echo "No change to commit"; exit 0; }
          git commit -m "demo-app(onprem): image tag ${{ needs.build-and-push.outputs.tag }}"
          git pull --rebase
          git push
